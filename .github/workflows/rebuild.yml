name: Rebuild Patched Image

on:
  push:
    paths:
      - 'patches/**'
      - 'scripts/build_and_test.sh'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        run: |
          chmod +x scripts/build_and_test.sh
          ./scripts/build_and_test.sh
        env:
          REGISTRY: registry.mycorp.com
          # Docker login token should be set as a secret named REGISTRY_TOKEN
      - name: Verify image
        run: |
          echo "Image built and pushed. Verify with your deployment."
